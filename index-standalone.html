<!-- 
  Xbox Game Sale Predictor - Standalone HTML App
  A simple web app to search Xbox games and predict when they'll go on sale
  Everything is contained in this one file (HTML, CSS, JavaScript)
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xbox Game Sale Predictor</title>
    <style>
        /* ===== RESET & VARIABLES ===== */
        /* Remove default margins and padding from all elements */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; /* Include padding/border in element width */
        }

        /* Define color variables used throughout the app */
        /* Xbox uses green (#107c10) as primary color */
        :root {
            --primary: #107c10;      /* Xbox green */
            --secondary: #005a9e;    /* Dark blue */
            --accent: #ffb900;       /* Gold/yellow for highlights */
            --dark: #1e1e1e;         /* Almost black text */
            --light: #f3f3f3;        /* Light gray background */
            --border: #e5e5e5;       /* Light gray for borders */
        }

        /* ===== BODY & GENERAL LAYOUT ===== */
        body {
            /* Use system fonts for best compatibility */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6; /* Comfortable reading line height */
        }

        /* Center content with max width */
        .container {
            max-width: 1200px;
            margin: 0 auto; /* Center horizontally */
            padding: 0 20px; /* Add horizontal padding on mobile */
        }

        /* ===== HEADER STYLING ===== */
        /* Top banner with gradient background */
        .header {
            /* Use gradient from primary to secondary color */
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 40px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
        }

        .logo {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700; /* Bold text */
        }

        .tagline {
            font-size: 1.1em;
            opacity: 0.95; /* Slightly transparent */
        }

        /* ===== SEARCH SECTION ===== */
        .search-section {
            margin: 40px 0;
            position: relative; /* For dropdown positioning */
        }

        /* Search input styling */
        .search-input {
            width: 100%; /* Full width */
            padding: 15px 20px; /* Internal spacing */
            font-size: 1em;
            border: 2px solid var(--border);
            border-radius: 8px; /* Rounded corners */
            transition: all 0.3s ease; /* Smooth animations */
        }

        /* Change border color when focused */
        .search-input:focus {
            outline: none; /* Remove default outline */
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16, 124, 16, 0.1); /* Green glow */
        }

        /* Dropdown for search results */
        .search-results {
            position: absolute; /* Float above other content */
            top: 100%; /* Position below search input */
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border);
            border-top: none; /* No top border (connects to input) */
            border-radius: 0 0 8px 8px; /* Rounded bottom corners */
            max-height: 300px;
            overflow-y: auto; /* Scrollbar if needed */
            z-index: 10; /* Above other elements */
            display: none; /* Hidden by default */
        }

        /* Show dropdown when it has 'active' class */
        .search-results.active {
            display: block;
        }

        /* Individual search result item */
        .search-result-item {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer; /* Show it's clickable */
            transition: background 0.2s ease;
        }

        /* Highlight on hover */
        .search-result-item:hover {
            background-color: var(--light);
        }

        /* ===== SECTION HEADINGS ===== */
        .games-section,
        .predictions-section {
            margin: 60px 0; /* Space between sections */
        }

        h2 {
            font-size: 1.8em;
            margin-bottom: 30px;
            color: var(--primary);
        }

        /* ===== GRID LAYOUT ===== */
        /* Responsive grid that adapts to screen size */
        .games-grid,
        .predictions-grid {
            display: grid;
            /* Auto-fill columns, minimum 250px, maximum 1fr (equal space) */
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px; /* Space between items */
        }

        /* ===== GAME CARD ===== */
        /* Individual game card styling */
        .game-card {
            background: white;
            border-radius: 8px;
            overflow: hidden; /* Hide content that overflows rounded corners */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow */
            transition: all 0.3s ease; /* Smooth animation on interaction */
            cursor: pointer; /* Show it's clickable */
        }

        /* Lift card slightly on hover */
        .game-card:hover {
            transform: translateY(-5px); /* Move up 5 pixels */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15); /* Darker shadow */
        }

        /* Top image section of card */
        .game-card-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; /* Center emoji vertically and horizontally */
            align-items: center;
            justify-content: center;
            font-size: 3em; /* Large emoji */
        }

        /* Bottom content section of card */
        .game-card-content {
            padding: 20px;
        }

        .game-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .game-info {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 12px;
        }

        .game-price {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
        }

        /* Badge showing discount or full price */
        .game-discount {
            display: inline-block;
            background-color: var(--accent); /* Gold background */
            color: var(--dark);
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9em;
        }

        /* Style for games not on sale */
        .game-discount.no-sale {
            background-color: var(--border);
            color: #666;
        }

        /* ===== PREDICTION CARDS ===== */
        /* Card showing predicted upcoming sales */
        .prediction-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-left: 4px solid var(--primary);
        }

        .prediction-game {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .prediction-date {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 8px;
        }

        .prediction-discount {
            font-size: 1.2em;
            color: var(--primary);
            font-weight: 700;
        }

        /* Confidence label and bar */
        .confidence {
            font-size: 0.85em;
            color: #999;
            margin-top: 8px;
        }

        /* Visual progress bar for confidence score */
        .confidence-bar {
            width: 100%;
            height: 6px;
            background-color: var(--border);
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
        }

        /* Fills up based on confidence percentage */
        .confidence-fill {
            height: 100%;
            background-color: var(--primary);
        }

        /* ===== MODAL (POPUP) ===== */
        /* Full-screen overlay modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* Close button (X) styling */
        .close {
            color: #aaa;
            float: right;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: var(--dark);
        }

        #modalTitle {
            color: var(--primary);
            margin-bottom: 20px;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h3 {
            color: var(--secondary);
            margin-bottom: 10px;
        }

        /* Footer */
        .footer {
            background-color: var(--dark);
            color: white;
            text-align: center;
            padding: 30px 0;
            margin-top: 60px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 1.8em;
            }
            .games-grid,
            .predictions-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .games-grid,
            .predictions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- ===== HEADER SECTION ===== -->
    <!-- Top banner with app title and tagline -->
    <header class="header">
        <div class="container">
            <h1 class="logo">🎮 Xbox Game Sale Predictor</h1>
            <p class="tagline">Predict when Xbox games will go on sale</p>
        </div>
    </header>

    <!-- ===== MAIN CONTENT SECTION ===== -->
    <main class="container">
        <!-- Search Section: Let users find games by name -->
        <section class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="Search for Xbox games..."
            >
            <!-- Dropdown for search results appears below input -->
            <div id="searchResults" class="search-results"></div>
        </section>

        <!-- Games Grid: Display all available games as cards -->
        <section class="games-section">
            <h2>Featured Games</h2>
            <!-- Cards will be generated here by JavaScript -->
            <div id="gamesList" class="games-grid"></div>
        </section>

        <!-- Game Detail Modal (Popup): Shows detailed info when user clicks a game -->
        <div id="gameModal" class="modal">
            <div class="modal-content">
                <!-- Close button (X) -->
                <span class="close">&times;</span>
                <!-- Title and content will be filled in by JavaScript -->
                <h2 id="modalTitle"></h2>
                <div id="modalBody"></div>
            </div>
        </div>

        <!-- Upcoming Sales Section: Show predicted sales for next 30 days -->
        <section class="predictions-section">
            <h2>⭐ Predicted Sales (Next 30 Days)</h2>
            <!-- Prediction cards will be generated here by JavaScript -->
            <div id="predictionsList" class="predictions-grid"></div>
        </section>
    </main>

    <!-- ===== FOOTER SECTION ===== -->
    <!-- Bottom of page with copyright -->
    <footer class="footer">
        <p>&copy; 2026 Xbox Game Sale Predictor. Predict smarter, save more. 💰</p>
    </footer>

    <script>
        // ===== MOCK DATA (Sample games and predictions) =====
        // This array contains fake game data. In a real app, this would come from a database.
        const mockGames = [
            {
                id: 1,
                title: "Starfield",
                emoji: "🚀",
                currentPrice: 69.99,
                originalPrice: 69.99,
                genre: "RPG",
                onSale: false,
                discount: 0
            },
            {
                id: 2,
                title: "Forza Motorsport",
                emoji: "🏎️",
                currentPrice: 34.99,
                originalPrice: 59.99,
                genre: "Racing",
                onSale: true,
                discount: 42
            },
            {
                id: 3,
                title: "Halo Infinite",
                emoji: "🎯",
                currentPrice: 39.99,
                originalPrice: 59.99,
                genre: "FPS",
                onSale: true,
                discount: 33
            },
            {
                id: 4,
                title: "Baldur's Gate 3",
                emoji: "⚔️",
                currentPrice: 49.99,
                originalPrice: 59.99,
                genre: "RPG",
                onSale: true,
                discount: 17
            },
            {
                id: 5,
                title: "Minecraft",
                emoji: "⛏️",
                currentPrice: 19.99,
                originalPrice: 19.99,
                genre: "Sandbox",
                onSale: false,
                discount: 0
            },
            {
                id: 6,
                title: "Sea of Thieves",
                emoji: "🏴‍☠️",
                currentPrice: 24.99,
                originalPrice: 39.99,
                genre: "Adventure",
                onSale: true,
                discount: 37
            }
        ];

        // ===== PREDICTIONS DATA =====
        // Predicted upcoming sales with confidence scores
        const mockPredictions = [
            {
                gameId: 1,
                title: "Starfield",
                nextSaleDate: "June 15, 2026",
                estimatedDiscount: 15,
                confidence: 72
            },
            {
                gameId: 3,
                title: "Halo Infinite",
                nextSaleDate: "June 20, 2026",
                estimatedDiscount: 25,
                confidence: 85
            },
            {
                gameId: 4,
                title: "Baldur's Gate 3",
                nextSaleDate: "June 25, 2026",
                estimatedDiscount: 20,
                confidence: 68
            }
        ];

        // ===== DOM ELEMENTS =====
        // Get references to HTML elements that we'll manipulate with JavaScript
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const gamesList = document.getElementById('gamesList');
        const predictionsList = document.getElementById('predictionsList');
        const gameModal = document.getElementById('gameModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const closeBtn = document.querySelector('.close');

        // ===== INITIALIZATION =====
        // Wait for page to fully load, then populate games and set up event listeners
        document.addEventListener('DOMContentLoaded', function() {
            displayGames(mockGames);        // Render all games to page
            displayPredictions(mockPredictions); // Render predictions
            setupEventListeners();          // Attach click/input handlers
        });

        // ===== EVENT LISTENERS =====
        // Attach event handlers to interactive elements
        function setupEventListeners() {
            // When user types in search box
            searchInput.addEventListener('input', handleSearch);
            
            // Hide search results when user clicks away
            searchInput.addEventListener('blur', () => {
                setTimeout(() => {
                    searchResults.classList.remove('active');
                }, 200);
            });
            
            // Close modal when X button is clicked
            closeBtn.addEventListener('click', closeModal);
            
            // Close modal when user clicks outside the modal box
            gameModal.addEventListener('click', (e) => {
                if (e.target === gameModal) closeModal();
            });
        }

        // ===== SEARCH FUNCTIONALITY =====
        // Filter games based on user input and show results
        function handleSearch(e) {
            const query = e.target.value.toLowerCase(); // Get search text, make lowercase
            
            // Hide dropdown if search is empty
            if (query.length === 0) {
                searchResults.classList.remove('active');
                return;
            }

            // Filter games that match the search query
            const filtered = mockGames.filter(game =>
                game.title.toLowerCase().includes(query)
            );

            // Show "no games found" message or list matching games
            if (filtered.length === 0) {
                searchResults.innerHTML = '<div style="padding: 12px 20px; color: #999;">No games found</div>';
            } else {
                // Create clickable list of matching games
                searchResults.innerHTML = filtered.map(game => `
                    <div class="search-result-item" onclick="openGameDetail(${game.id})">
                        <strong>${game.title}</strong><br>
                        <small>${game.genre} • $${game.currentPrice}</small>
                    </div>
                `).join('');
            }

            searchResults.classList.add('active');
        }

        // ===== DISPLAY GAMES =====
        // Render game cards to the page
        function displayGames(games) {
            gamesList.innerHTML = games.map(game => `
                <div class="game-card" onclick="openGameDetail(${game.id})">
                    <div class="game-card-image">${game.emoji}</div>
                    <div class="game-card-content">
                        <div class="game-title">${game.title}</div>
                        <div class="game-info">${game.genre}</div>
                        <div class="game-price">$${game.currentPrice}</div>
                        <span class="game-discount ${game.onSale ? '' : 'no-sale'}">
                            ${game.onSale ? `${game.discount}% OFF` : 'Full Price'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // ===== DISPLAY PREDICTIONS =====
        // Render sale prediction cards to the page
        function displayPredictions(predictions) {
            predictionsList.innerHTML = predictions.map(pred => `
                <div class="prediction-card">
                    <div class="prediction-game">${pred.title}</div>
                    <div class="prediction-date">📅 ${pred.nextSaleDate}</div>
                    <div class="prediction-discount">~${pred.estimatedDiscount}% off</div>
                    <div class="confidence">
                        Confidence: ${pred.confidence}%
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${pred.confidence}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ===== GAME DETAIL MODAL =====
        // Show detailed information about a specific game in a popup
        function openGameDetail(gameId) {
            // Find the game with this ID
            const game = mockGames.find(g => g.id === gameId);
            if (!game) return; // Stop if game not found

            // Look for prediction data for this game
            const prediction = mockPredictions.find(p => p.gameId === gameId);

            // Set modal title with emoji and game name
            modalTitle.textContent = `${game.emoji} ${game.title}`;
            
            // Build HTML content for the modal
            let modalHTML = `
                <div class="modal-section">
                    <h3>Current Price</h3>
                    <div style="font-size: 1.8em; color: #107c10; font-weight: 700;">
                        $${game.currentPrice}
                        ${game.onSale ? `<span style="color: #ffb900; font-size: 0.8em;"> (-${game.discount}%)</span>` : ''}
                    </div>
                    ${game.originalPrice !== game.currentPrice ? `<div style="color: #999; text-decoration: line-through;">Original: $${game.originalPrice}</div>` : ''}
                </div>

                <div class="modal-section">
                    <h3>Game Details</h3>
                    <p><strong>Genre:</strong> ${game.genre}</p>
                    <p><strong>Status:</strong> ${game.onSale ? '✅ On Sale' : '⏳ Full Price'}</p>
                </div>
            `;

            // If we have prediction data, add it to the modal
            if (prediction) {
                modalHTML += `
                    <div class="modal-section">
                        <h3>Sale Prediction</h3>
                        <p><strong>Next Sale:</strong> ${prediction.nextSaleDate}</p>
                        <p><strong>Estimated Discount:</strong> ~${prediction.estimatedDiscount}%</p>
                        <p><strong>Confidence:</strong> ${prediction.confidence}%</p>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${prediction.confidence}%"></div>
                        </div>
                    </div>
                `;
            }

            // Add footer info
            modalHTML += `
                <div class="modal-section">
                    <h3>About</h3>
                    <p>This is an Xbox game from the Game Pass and Xbox Store. Check back soon for price updates!</p>
                </div>
            `;

            // Insert HTML and show modal
            modalBody.innerHTML = modalHTML;
            gameModal.classList.add('active'); // Show by adding 'active' class
        }

        // ===== CLOSE MODAL =====
        // Hide the modal popup
        function closeModal() {
            gameModal.classList.remove('active'); // Hide by removing 'active' class
        }
    </script>
</body>
</html>
