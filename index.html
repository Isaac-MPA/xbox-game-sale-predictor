<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xbox Game Sale Predictor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">🎮 Xbox Game Sale Predictor</h1>
            <p class="tagline">Predict when Xbox games will go on sale</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Search Section -->
        <section class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="Search for Xbox games..."
            >
            <div id="searchResults" class="search-results"></div>
        </section>

        <!-- Games Grid -->
        <section class="games-section">
            <h2>Featured Games</h2>
            <div id="gamesList" class="games-grid">
                <!-- Games will be populated here -->
            </div>
        </section>

        <!-- Game Detail Modal -->
        <div id="gameModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle"></h2>
                <div id="modalBody"></div>
            </div>
        </div>

        <!-- Upcoming Sales Section -->
        <section class="predictions-section">
            <h2>⭐ Predicted Sales (Next 30 Days)</h2>
            <div id="predictionsList" class="predictions-grid">
                <!-- Predictions will be populated here -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Xbox Game Sale Predictor. Predict smarter, save more. 💰</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
